name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  page_build:

permissions:
  contents: write

concurrency:
  group: google-scholar-citation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install and verify dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r google_scholar_crawler/requirements.txt
          python -m pip check
          python -c "from bibtexparser.bibdatabase import BibDatabase; from scholarly import scholarly; print('Dependency imports OK')"

      - name: Fetch Google Scholar citations
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python main.py

      - name: Publish citation JSON
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b google-scholar-stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.json'
          git commit -m 'Updated Citation Data'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
